name: OpenGenesis-BioCore v0.2 validation

on:
  push:
    branches:
      - v0.2.0-dev
  pull_request:
    branches:
      - main
      - v0.2.0-dev
  workflow_dispatch:

env:
  BIOCORE_ITERATION: "048"
  BIOCORE_TEST_FLOOR: "70"

permissions:
  contents: read

jobs:
  linux-matrix:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-gcc-debug
          - linux-gcc-release
          - linux-clang-debug
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev clang

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Preserve active test floor
        shell: bash
        run: |
          count="$(ctest --preset "${{ matrix.preset }}" -N | sed -n 's/^Total Tests: //p')"
          if [[ -z "${count}" || "${count}" -lt "${BIOCORE_TEST_FLOOR}" ]]; then
            echo "Expected at least ${BIOCORE_TEST_FLOOR} tests (v0.1 baseline: 67); found '${count:-unknown}'." >&2
            exit 1
          fi
          echo "CTest count: ${count}"

      - name: Run regression suite
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure

      - name: Verify v0.2 development identity
        if: matrix.preset == 'linux-gcc-debug'
        shell: bash
        run: |
          actual="$(build/linux-gcc-debug/apps/biocore/biocore --version)"
          test "${actual}" = "0.2.0-dev"
          echo "Development identity: ${actual}"

      - name: Verify browser failure evidence contract
        if: matrix.preset == 'linux-gcc-debug'
        shell: bash
        run: |
          node --check frontend/assets/app.js
          node - <<'JS'
          const { core } = require('./frontend/assets/app.js');
          const normalized = core.normalizeJob({
            id: 'failure-ui',
            status: 'failed',
            failure: {
              kind: 'worker_reported_failure',
              message: 'worker failed',
              exitCode: 17,
              workerTimestampUtc: '2026-09-01T08:00:00Z',
              recordedAtUtc: '2026-09-01T08:00:01Z'
            }
          });
          if (!normalized || normalized.failure?.exitCode !== 17 ||
              normalized.failure?.message !== 'worker failed') process.exit(1);
          const state = {
            jobs: new Map([['failure-ui', { ...normalized, status: 'running', failure: null }]]),
            logs: new Map(),
            cursors: new Map()
          };
          const result = core.applyLifecycle(state, {
            type: 'worker.lifecycle',
            eventType: 'failed',
            jobId: 'failure-ui',
            launchRevision: 1,
            sequence: 1,
            workerTimestampUtc: '2026-09-01T08:00:02Z',
            message: 'terminal failure',
            exitCode: 9
          });
          if (!result.accepted ||
              state.jobs.get('failure-ui').failure?.kind !== 'worker_reported_failure' ||
              state.jobs.get('failure-ui').failure?.exitCode !== 9) process.exit(2);
          console.log('Browser failure evidence contract PASS');
          JS

      - name: Guard development preset identities
        if: matrix.preset == 'linux-gcc-debug'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("CMakePresets.json").read_text(encoding="utf-8"))
          offenders = []
          for preset in data.get("configurePresets", []):
              variables = preset.get("cacheVariables", {})
              if variables.get("BIOCORE_VERSION_SUFFIX") == "":
                  offenders.append(preset.get("name", "<unnamed>"))
          if offenders:
              raise SystemExit(
                  "Development preset(s) force an empty final-release suffix: " + ", ".join(offenders)
              )
          print("No normal development configure preset forces an empty version suffix.")
          PY

  sanitizers:
    name: linux-gcc-debug-asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev

      - name: Configure ASan + UBSan
        run: |
          cmake -S . -B build/linux-gcc-asan-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DBIOCORE_BUILD_TESTS=ON \
            -DBIOCORE_WARNINGS_AS_ERRORS=ON \
            -DBIOCORE_ENABLE_ASAN=ON \
            -DBIOCORE_ENABLE_UBSAN=ON

      - name: Build ASan + UBSan
        run: cmake --build build/linux-gcc-asan-ubsan --parallel

      - name: Preserve active test floor
        shell: bash
        run: |
          count="$(ctest --test-dir build/linux-gcc-asan-ubsan -N | sed -n 's/^Total Tests: //p')"
          if [[ -z "${count}" || "${count}" -lt "${BIOCORE_TEST_FLOOR}" ]]; then
            echo "Expected at least ${BIOCORE_TEST_FLOOR} tests (v0.1 baseline: 67); found '${count:-unknown}'." >&2
            exit 1
          fi
          echo "CTest count: ${count}"

      - name: Run ASan + UBSan regression suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/linux-gcc-asan-ubsan --output-on-failure

  gemini-review-package:
    name: Gemini four-part review package
    needs:
      - linux-matrix
      - sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate exact four-part Markdown package
        run: |
          python3 scripts/generate-gemini-review.py \
            --iteration "${BIOCORE_ITERATION}" \
            --parts 4 \
            --ci-run-id "${{ github.run_id }}" \
            --output artifacts/gemini-review

      - name: Verify package shape and checksums
        shell: bash
        run: |
          mapfile -t parts < <(find artifacts/gemini-review -maxdepth 1 -type f -name '*-part-*-of-04.md' -print | sort)
          test "${#parts[@]}" -eq 4
          cd artifacts/gemini-review
          sha256sum -c "OpenGenesis-BioCore-iteration-${BIOCORE_ITERATION}-GEMINI-review-SHA256SUMS.txt"

      - name: Upload Gemini review package
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-GEMINI-review
          path: artifacts/gemini-review/
          if-no-files-found: error
          retention-days: 30
