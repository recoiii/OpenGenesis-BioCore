name: OpenGenesis-BioCore v0.3 iteration validation

on:
  push:
    branches:
      - v0.3.0-dev
  pull_request:
    branches:
      - v0.3.0-dev
  workflow_dispatch:

env:
  BIOCORE_ITERATION: "065"
  BIOCORE_TEST_FLOOR: "115"
  BIOCORE_DEVELOPMENT_VERSION: "0.3.0-dev"
  BIOCORE_ACCEPTED_BASELINE_NAME: "accepted/iteration-064"
  BIOCORE_ACCEPTED_BASELINE_SHA: "f7b11d655330fe50f2fd2fa7f890a895cc1e9a84"

permissions:
  contents: read

jobs:
  source-candidate:
    name: Exact source candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Seal source candidate
        shell: bash
        run: |
          mkdir -p artifacts/source
          archive="artifacts/source/OpenGenesis-BioCore-iteration-${BIOCORE_ITERATION}-source-CANDIDATE.zip"
          git archive --format=zip --prefix="OpenGenesis-BioCore/" --output="${archive}" HEAD
          sha256sum "${archive}" | tee artifacts/source/SHA256SUMS.txt
          git rev-parse HEAD | tee artifacts/source/COMMIT.txt
      - name: Upload source candidate
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-source-CANDIDATE
          path: artifacts/source/
          if-no-files-found: error
          retention-days: 30

  linux-matrix:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-gcc-debug
          - linux-gcc-release
          - linux-clang-debug
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev clang
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel
      - name: Require exact active test suite
        shell: bash
        run: |
          count="$(ctest --preset "${{ matrix.preset }}" -N | sed -n 's/^Total Tests: //p')"
          test "${count}" = "${BIOCORE_TEST_FLOOR}"
          echo "CTest count: ${count}"
      - name: Run regression suite
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure
      - name: Verify v0.3 development identity
        if: matrix.preset == 'linux-gcc-debug'
        shell: bash
        run: |
          actual="$(build/linux-gcc-debug/apps/biocore/biocore --version)"
          test "${actual}" = "${BIOCORE_DEVELOPMENT_VERSION}"
          echo "Development identity: ${actual}"

  sanitizers:
    name: linux-gcc-debug-asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev
      - name: Configure ASan + UBSan
        run: |
          cmake -S . -B build/linux-gcc-asan-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ \
            -DBIOCORE_BUILD_TESTS=ON -DBIOCORE_WARNINGS_AS_ERRORS=ON \
            -DBIOCORE_ENABLE_ASAN=ON -DBIOCORE_ENABLE_UBSAN=ON
      - name: Build ASan + UBSan
        run: cmake --build build/linux-gcc-asan-ubsan --parallel
      - name: Require exact active test suite
        shell: bash
        run: |
          count="$(ctest --test-dir build/linux-gcc-asan-ubsan -N | sed -n 's/^Total Tests: //p')"
          test "${count}" = "${BIOCORE_TEST_FLOOR}"
          echo "CTest count: ${count}"
      - name: Run ASan + UBSan regression suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/linux-gcc-asan-ubsan --output-on-failure

  case-control-association-benchmark:
    name: 1M-observation case/control regression benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev time
      - name: Configure release benchmark
        run: cmake --preset linux-gcc-release
      - name: Build case/control benchmark target
        run: cmake --build --preset linux-gcc-release --target biocore-case-control-association-benchmark --parallel
      - name: Run and capture case/control benchmark
        shell: bash
        run: |
          mkdir -p artifacts/evidence
          /usr/bin/time -v build/linux-gcc-release/src/domain/biocore-case-control-association-benchmark \
            > artifacts/evidence/case-control-association-benchmark.txt \
            2> artifacts/evidence/case-control-association-time.txt
          cat artifacts/evidence/case-control-association-benchmark.txt
          cat artifacts/evidence/case-control-association-time.txt
          grep -F 'samples=100' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'variants=10000' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'observations=1000000' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'association_tests=20000' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'checksum=250000' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'Maximum resident set size' artifacts/evidence/case-control-association-time.txt
      - name: Upload case/control regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-case-control-regression
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 30

  variant-workspace-benchmark:
    name: 100k-variant workspace bounded-query benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev time
      - name: Configure release benchmark
        run: cmake --preset linux-gcc-release
      - name: Build workspace benchmark target
        run: cmake --build --preset linux-gcc-release --target biocore-variant-workspace-benchmark --parallel
      - name: Run and capture workspace benchmark
        shell: bash
        run: |
          mkdir -p artifacts/evidence
          /usr/bin/time -v build/linux-gcc-release/biocore-variant-workspace-benchmark \
            > artifacts/evidence/variant-workspace-benchmark.json \
            2> artifacts/evidence/variant-workspace-time.txt
          cat artifacts/evidence/variant-workspace-benchmark.json
          cat artifacts/evidence/variant-workspace-time.txt
          grep -F '"variants":100000' artifacts/evidence/variant-workspace-benchmark.json
          grep -F '"queries":200' artifacts/evidence/variant-workspace-benchmark.json
          grep -F '"window_limit":100' artifacts/evidence/variant-workspace-benchmark.json
          grep -F '"max_rows_returned":100' artifacts/evidence/variant-workspace-benchmark.json
          grep -F 'Maximum resident set size' artifacts/evidence/variant-workspace-time.txt
      - name: Upload Iteration 065 workspace evidence
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-variant-workspace-benchmark
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 30

  gemini-review-package:
    name: Gemini four-part review package
    needs:
      - source-candidate
      - linux-matrix
      - sanitizers
      - case-control-association-benchmark
      - variant-workspace-benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download case/control regression evidence
        uses: actions/download-artifact@v5
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-case-control-regression
          path: artifacts/evidence
      - name: Download workspace benchmark evidence
        uses: actions/download-artifact@v5
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-variant-workspace-benchmark
          path: artifacts/evidence
      - name: Generate exact four-part Markdown package
        run: |
          python3 scripts/generate-gemini-review-v03.py \
            --iteration "${BIOCORE_ITERATION}" \
            --ci-run-id "${{ github.run_id }}" \
            --baseline-name "${BIOCORE_ACCEPTED_BASELINE_NAME}" \
            --baseline-commit "${BIOCORE_ACCEPTED_BASELINE_SHA}" \
            --evidence-dir artifacts/evidence \
            --output artifacts/gemini-review
      - name: Verify package shape, completeness, size and checksums
        shell: bash
        run: |
          mapfile -t parts < <(find artifacts/gemini-review -maxdepth 1 -type f -name '*-part-*-of-04.md' -print | sort)
          test "${#parts[@]}" -eq 4
          for part in "${parts[@]}"; do
            size="$(wc -c < "${part}")"
            test "${size}" -le 120000
            grep -F 'Changed-file completeness: PASS' "${part}" >/dev/null
            echo "$(basename "${part}"): ${size} bytes"
          done
          cd artifacts/gemini-review
          sha256sum -c "OpenGenesis-BioCore-iteration-${BIOCORE_ITERATION}-GEMINI-review-SHA256SUMS.txt"
      - name: Upload Gemini review package
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-GEMINI-review
          path: artifacts/gemini-review/
          if-no-files-found: error
          retention-days: 30
