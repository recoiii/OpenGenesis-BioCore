name: OpenGenesis-BioCore v0.3 iteration validation

on:
  push:
    branches:
      - v0.3.0-dev
  pull_request:
    branches:
      - v0.3.0-dev
  workflow_dispatch:

env:
  BIOCORE_ITERATION: "067"
  BIOCORE_TEST_FLOOR: "125"
  BIOCORE_DEVELOPMENT_VERSION: "0.3.0-dev"
  BIOCORE_ACCEPTED_BASELINE_NAME: "accepted/iteration-066"
  BIOCORE_ACCEPTED_BASELINE_SHA: "fa9d76b3212478270cadff7fdff552c89562f830"

permissions:
  contents: read

jobs:
  source-candidate:
    name: Exact source candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Seal source candidate
        shell: bash
        run: |
          mkdir -p artifacts/source
          archive="artifacts/source/OpenGenesis-BioCore-iteration-${BIOCORE_ITERATION}-source-CANDIDATE.zip"
          git archive --format=zip --prefix="OpenGenesis-BioCore/" --output="${archive}" HEAD
          sha256sum "${archive}" | tee artifacts/source/SHA256SUMS.txt
          git rev-parse HEAD | tee artifacts/source/COMMIT.txt
      - name: Upload source candidate
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-source-CANDIDATE
          path: artifacts/source/
          if-no-files-found: error
          retention-days: 30

  linux-matrix:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-gcc-debug
          - linux-gcc-release
          - linux-clang-debug
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev clang
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel
      - name: Require exact active test suite
        shell: bash
        run: |
          count="$(ctest --preset "${{ matrix.preset }}" -N | sed -n 's/^Total Tests: //p')"
          test "${count}" = "${BIOCORE_TEST_FLOOR}"
          echo "CTest count: ${count}"
      - name: Run regression suite
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure
      - name: Verify v0.3 development identity
        if: matrix.preset == 'linux-gcc-debug'
        shell: bash
        run: |
          actual="$(build/linux-gcc-debug/apps/biocore/biocore --version)"
          test "${actual}" = "${BIOCORE_DEVELOPMENT_VERSION}"
          echo "Development identity: ${actual}"

  sanitizers:
    name: linux-gcc-debug-asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev
      - name: Configure ASan + UBSan
        run: |
          cmake -S . -B build/linux-gcc-asan-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ \
            -DBIOCORE_BUILD_TESTS=ON -DBIOCORE_WARNINGS_AS_ERRORS=ON \
            -DBIOCORE_ENABLE_ASAN=ON -DBIOCORE_ENABLE_UBSAN=ON
      - name: Build ASan + UBSan
        run: cmake --build build/linux-gcc-asan-ubsan --parallel
      - name: Require exact active test suite
        shell: bash
        run: |
          count="$(ctest --test-dir build/linux-gcc-asan-ubsan -N | sed -n 's/^Total Tests: //p')"
          test "${count}" = "${BIOCORE_TEST_FLOOR}"
          echo "CTest count: ${count}"
      - name: Run ASan + UBSan regression suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/linux-gcc-asan-ubsan --output-on-failure

  case-control-association-benchmark:
    name: 1M-observation case/control regression benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev time
      - name: Configure release benchmark
        run: cmake --preset linux-gcc-release
      - name: Build case/control benchmark target
        run: cmake --build --preset linux-gcc-release --target biocore-case-control-association-benchmark --parallel
      - name: Run and capture case/control benchmark
        shell: bash
        run: |
          mkdir -p artifacts/evidence
          /usr/bin/time -v build/linux-gcc-release/src/domain/biocore-case-control-association-benchmark \
            > artifacts/evidence/case-control-association-benchmark.txt \
            2> artifacts/evidence/case-control-association-time.txt
          cat artifacts/evidence/case-control-association-benchmark.txt
          cat artifacts/evidence/case-control-association-time.txt
          grep -F 'samples=100' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'variants=10000' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'observations=1000000' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'association_tests=20000' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'checksum=250000' artifacts/evidence/case-control-association-benchmark.txt
          grep -F 'Maximum resident set size' artifacts/evidence/case-control-association-time.txt
      - name: Upload case/control regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-case-control-regression
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 30

  variant-workspace-benchmark:
    name: 100k-variant workspace bounded-query benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev time
      - name: Configure release benchmark
        run: cmake --preset linux-gcc-release
      - name: Build workspace benchmark target
        run: cmake --build --preset linux-gcc-release --target biocore-variant-workspace-benchmark --parallel
      - name: Run and capture workspace benchmark
        shell: bash
        run: |
          mkdir -p artifacts/evidence
          /usr/bin/time -v build/linux-gcc-release/biocore-variant-workspace-benchmark \
            > artifacts/evidence/variant-workspace-benchmark.json \
            2> artifacts/evidence/variant-workspace-time.txt
          cat artifacts/evidence/variant-workspace-benchmark.json
          cat artifacts/evidence/variant-workspace-time.txt
          grep -F '"variants":100000' artifacts/evidence/variant-workspace-benchmark.json
          grep -F '"queries":200' artifacts/evidence/variant-workspace-benchmark.json
          grep -F '"window_limit":100' artifacts/evidence/variant-workspace-benchmark.json
          grep -F '"max_rows_returned":100' artifacts/evidence/variant-workspace-benchmark.json
          grep -F 'Maximum resident set size' artifacts/evidence/variant-workspace-time.txt
      - name: Upload workspace regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-variant-workspace-benchmark
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 30

  variant-export-benchmark:
    name: 100k-variant streaming export benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev time
      - name: Configure release benchmark
        run: cmake --preset linux-gcc-release
      - name: Build variant export benchmark target
        run: cmake --build --preset linux-gcc-release --target biocore-variant-export-benchmark --parallel
      - name: Run and capture streaming export benchmark
        shell: bash
        run: |
          mkdir -p artifacts/evidence
          /usr/bin/time -v build/linux-gcc-release/biocore-variant-export-benchmark \
            > artifacts/evidence/variant-export-benchmark.json \
            2> artifacts/evidence/variant-export-time.txt
          cat artifacts/evidence/variant-export-benchmark.json
          cat artifacts/evidence/variant-export-time.txt
          grep -F '"variants":100000' artifacts/evidence/variant-export-benchmark.json
          grep -F '"format":"tsv"' artifacts/evidence/variant-export-benchmark.json
          grep -F '"bytes":' artifacts/evidence/variant-export-benchmark.json
          grep -F 'Maximum resident set size' artifacts/evidence/variant-export-time.txt
      - name: Upload streaming export regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-variant-export-benchmark
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 30

  truth-set-benchmark:
    name: 250k-variant synthetic truth-set benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev time
      - name: Configure release benchmark
        run: cmake --preset linux-gcc-release
      - name: Build truth-set benchmark target
        run: cmake --build --preset linux-gcc-release --target biocore-truth-set-benchmark-benchmark --parallel
      - name: Run and capture synthetic truth-set benchmark
        shell: bash
        run: |
          mkdir -p artifacts/evidence
          /usr/bin/time -v build/linux-gcc-release/biocore-truth-set-benchmark-benchmark \
            > artifacts/evidence/truth-set-benchmark.json \
            2> artifacts/evidence/truth-set-time.txt
          cat artifacts/evidence/truth-set-benchmark.json
          cat artifacts/evidence/truth-set-time.txt
          grep -F '"truth_variants":250000' artifacts/evidence/truth-set-benchmark.json
          grep -F '"candidate_variants":250000' artifacts/evidence/truth-set-benchmark.json
          grep -F '"tp":245000' artifacts/evidence/truth-set-benchmark.json
          grep -F '"fp":5000' artifacts/evidence/truth-set-benchmark.json
          grep -F '"fn":5000' artifacts/evidence/truth-set-benchmark.json
          grep -F 'Maximum resident set size' artifacts/evidence/truth-set-time.txt
      - name: Upload synthetic truth-set evidence
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-truth-set-benchmark
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 30

  giab-truth-set-benchmark:
    name: GIAB HG002 external truth-set compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev time curl
      - name: Configure release benchmark
        run: cmake --preset linux-gcc-release
      - name: Build GIAB benchmark target
        run: cmake --build --preset linux-gcc-release --target biocore-giab-truth-benchmark --parallel
      - name: Fetch and verify pinned GIAB HG002 truth fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/evidence artifacts/giab
          base='https://raw.githubusercontent.com/google/deepvariant/45f2627504c59785ea2b88d0256a2ec347bce7b4/deeptrio/testdata/input'
          vcf_gz='artifacts/giab/HG002_GRCh38_1_22_v4.2.1_benchmark.chr20.vcf.gz'
          bed='artifacts/giab/HG002_GRCh38_1_22_v4.2.1_benchmark.chr20.bed'
          curl --fail --location --retry 5 --retry-all-errors "${base}/HG002_GRCh38_1_22_v4.2.1_benchmark.chr20.vcf.gz" -o "${vcf_gz}"
          curl --fail --location --retry 5 --retry-all-errors "${base}/HG002_GRCh38_1_22_v4.2.1_benchmark.chr20.bed" -o "${bed}"
          test "$(git hash-object "${vcf_gz}")" = 'c642801a079fbfc1a43df80d47d19493c58ef135'
          test "$(git hash-object "${bed}")" = '31528cdbf5648f467890fe780dc20a8396cb3131'
          sha256sum "${vcf_gz}" "${bed}" | tee artifacts/evidence/giab-source-SHA256SUMS.txt
          gzip -dc "${vcf_gz}" > artifacts/giab/HG002.truth.vcf
      - name: Run external GIAB truth-set compatibility benchmark
        shell: bash
        run: |
          /usr/bin/time -v build/linux-gcc-release/biocore-giab-truth-benchmark \
            artifacts/giab/HG002.truth.vcf \
            artifacts/giab/HG002_GRCh38_1_22_v4.2.1_benchmark.chr20.bed \
            > artifacts/evidence/giab-truth-benchmark.json \
            2> artifacts/evidence/giab-truth-time.txt
          cat artifacts/evidence/giab-truth-benchmark.json
          cat artifacts/evidence/giab-truth-time.txt
          grep -F '"dataset":"GIAB HG002 GRCh38 v4.2.1 chr20"' artifacts/evidence/giab-truth-benchmark.json
          grep -F '"fp":0' artifacts/evidence/giab-truth-benchmark.json
          grep -F '"fn":0' artifacts/evidence/giab-truth-benchmark.json
          grep -F '"precision":1,"recall":1,"f1":1' artifacts/evidence/giab-truth-benchmark.json
          grep -F 'Maximum resident set size' artifacts/evidence/giab-truth-time.txt
      - name: Upload external GIAB evidence
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-giab-truth-set
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 30

  gemini-review-package:
    name: Gemini four-part review package
    needs:
      - source-candidate
      - linux-matrix
      - sanitizers
      - case-control-association-benchmark
      - variant-workspace-benchmark
      - variant-export-benchmark
      - truth-set-benchmark
      - giab-truth-set-benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download case/control regression evidence
        uses: actions/download-artifact@v5
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-case-control-regression
          path: artifacts/evidence
      - name: Download workspace benchmark evidence
        uses: actions/download-artifact@v5
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-variant-workspace-benchmark
          path: artifacts/evidence
      - name: Download variant export benchmark evidence
        uses: actions/download-artifact@v5
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-variant-export-benchmark
          path: artifacts/evidence
      - name: Download synthetic truth-set benchmark evidence
        uses: actions/download-artifact@v5
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-truth-set-benchmark
          path: artifacts/evidence
      - name: Download external GIAB truth-set evidence
        uses: actions/download-artifact@v5
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-giab-truth-set
          path: artifacts/evidence
      - name: Generate exact four-part Markdown package
        run: |
          python3 scripts/generate-gemini-review-v03.py \
            --iteration "${BIOCORE_ITERATION}" \
            --ci-run-id "${{ github.run_id }}" \
            --baseline-name "${BIOCORE_ACCEPTED_BASELINE_NAME}" \
            --baseline-commit "${BIOCORE_ACCEPTED_BASELINE_SHA}" \
            --evidence-dir artifacts/evidence \
            --output artifacts/gemini-review
      - name: Verify package shape, completeness, size and checksums
        shell: bash
        run: |
          mapfile -t parts < <(find artifacts/gemini-review -maxdepth 1 -type f -name '*-part-*-of-04.md' -print | sort)
          test "${#parts[@]}" -eq 4
          for part in "${parts[@]}"; do
            size="$(wc -c < "${part}")"
            test "${size}" -le 120000
            grep -F 'Changed-file completeness: PASS' "${part}" >/dev/null
            echo "$(basename "${part}"): ${size} bytes"
          done
          cd artifacts/gemini-review
          sha256sum -c "OpenGenesis-BioCore-iteration-${BIOCORE_ITERATION}-GEMINI-review-SHA256SUMS.txt"
      - name: Upload Gemini review package
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-${{ env.BIOCORE_ITERATION }}-GEMINI-review
          path: artifacts/gemini-review/
          if-no-files-found: error
          retention-days: 30
