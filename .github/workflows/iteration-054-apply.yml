name: Iteration 054 staging apply

on:
  push:
    branches:
      - iteration-054-staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev zlib1g-dev

      - name: Apply final-closure transformation
        run: |
          python3 scripts/iteration-054-apply.py
          python3 scripts/iteration-054-release-test-fix.py

      - name: Validate Linux final identity and regression floor
        shell: bash
        run: |
          cmake --preset linux-gcc-debug
          cmake --build --preset linux-gcc-debug --parallel
          count="$(ctest --preset linux-gcc-debug -N | sed -n 's/^Total Tests: //p')"
          test "${count}" = "75"
          ctest --preset linux-gcc-debug --output-on-failure
          test "$(build/linux-gcc-debug/apps/biocore/biocore --version)" = "0.2.0"
          python3 -m py_compile scripts/generate-gemini-review.py

      - name: Package workflow-neutral candidate files
        shell: bash
        run: |
          mkdir -p artifacts/iteration-054-candidate-files
          files=(
            .github/workflows/v0.2-validation.yml
            CITATION.cff
            CMakeLists.txt
            README.md
            docs/development/ITERATION-053-ACCEPTANCE.md
            docs/development/ITERATION-054.md
            docs/release/FINAL-WINDOWS-CLOSURE.md
            docs/release/RELEASE-NOTES-0.2.0.md
            docs/release/VALIDATION.md
            scripts/generate-gemini-review.py
            scripts/validate-windows-final.ps1
            tests/export_report_foundation_tests.cpp
          )
          for file in "${files[@]}"; do
            mkdir -p "artifacts/iteration-054-candidate-files/$(dirname "${file}")"
            cp "${file}" "artifacts/iteration-054-candidate-files/${file}"
          done
          printf '%s\n' "${files[@]}" > artifacts/iteration-054-candidate-files/FILES.txt
          (cd artifacts/iteration-054-candidate-files && sha256sum "${files[@]}" > SHA256SUMS.txt)

      - name: Upload validated candidate files
        uses: actions/upload-artifact@v4
        with:
          name: OpenGenesis-BioCore-iteration-054-candidate-files
          path: artifacts/iteration-054-candidate-files/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Publish non-workflow candidate files
        shell: bash
        run: |
          rm -rf /tmp/iteration-054-candidate
          git worktree add --detach /tmp/iteration-054-candidate origin/accepted/iteration-053
          files=(
            CITATION.cff
            CMakeLists.txt
            README.md
            docs/development/ITERATION-053-ACCEPTANCE.md
            docs/development/ITERATION-054.md
            docs/release/FINAL-WINDOWS-CLOSURE.md
            docs/release/RELEASE-NOTES-0.2.0.md
            docs/release/VALIDATION.md
            scripts/generate-gemini-review.py
            scripts/validate-windows-final.ps1
            tests/export_report_foundation_tests.cpp
          )
          for file in "${files[@]}"; do
            mkdir -p "/tmp/iteration-054-candidate/$(dirname "${file}")"
            cp "${file}" "/tmp/iteration-054-candidate/${file}"
          done
          cd /tmp/iteration-054-candidate
          git config user.name "OpenGenesis-BioCore Automation"
          git config user.email "noreply@github.com"
          git add "${files[@]}"
          git commit -m "Iteration 054: prepare v0.2.0 final closure"
          git push --force origin HEAD:refs/heads/iteration-054-candidate
