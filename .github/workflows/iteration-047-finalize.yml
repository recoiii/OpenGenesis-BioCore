name: Iteration 047 staging finalizer

on:
  push:
    branches:
      - iteration-047-staging

permissions:
  contents: write

jobs:
  finalize-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize exact final source
        run: python3 scripts/finalize-iteration-047.py

      - name: Verify exact late-file blob identities
        shell: bash
        run: |
          test "$(git hash-object src/presentation/source/local_api.cpp)" = "c651ccf9cadcc4345b3803b98aab86fe34e7549e"
          test "$(git hash-object frontend/index.html)" = "c462a171ff2e0da700dc7782ff6dc5b5a75abaa1"
          test "$(git hash-object frontend/assets/app.js)" = "cb73e7a60c6ea4338e28f056c0c8a37ad7105a45"
          test "$(git hash-object tests/project_database_tests.cpp)" = "61a57fc6d8c76954070acbb9bdfc8a6cf8811f1b"
          node --check frontend/assets/app.js

      - name: Publish exact candidate commit
        shell: bash
        run: |
          git config user.name "OpenGenesis-BioCore CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Iteration 047: finalize durable failure evidence"
          git push origin HEAD:refs/heads/iteration-047-candidate --force
