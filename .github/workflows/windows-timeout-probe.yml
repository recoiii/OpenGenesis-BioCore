name: OpenGenesis-BioCore Iteration 054 final validation launcher

on:
  push:
    branches:
      - iteration-054-timeout-probe
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-exact-final-candidate:
    name: Dispatch exact Iteration 054 candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Verify and dispatch exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 31691d65e4e4a7dab9be0730c886e24890043194
          CANDIDATE_REF: iteration-054-final-candidate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANDIDATE_REF} --jq '.object.sha')"
          test "${actual}" = "${EXPECTED_SHA}"
          echo "Exact candidate verified: ${actual}"
          gh workflow run v0.2-validation.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${CANDIDATE_REF}"
          echo "Official final validation dispatched for ${CANDIDATE_REF} at ${EXPECTED_SHA}"
