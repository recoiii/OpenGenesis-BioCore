name: OpenGenesis-BioCore Windows timeout probe

on:
  push:
    branches:
      - iteration-054-timeout-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-server-bootstrap-probe:
    name: Windows local_server_bootstrap probe
    runs-on: windows-latest
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve hosted vcpkg root
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT -and $env:VCPKG_INSTALLATION_ROOT) {
            "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: biocore-windows-probe-vcpkg-x64-sqlite3-zlib-v1

      - name: Install minimal probe dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install sqlite3:x64-windows zlib:x64-windows --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure lightweight Windows probe
        shell: pwsh
        run: |
          cmake -S . -B build/windows-probe -G "Visual Studio 18 2026" -A x64 `
            -DBIOCORE_BUILD_TESTS=ON `
            -DBIOCORE_WARNINGS_AS_ERRORS=ON `
            -DBIOCORE_REQUIRE_DROGON=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build only local server bootstrap probe
        shell: pwsh
        run: |
          cmake --build build/windows-probe --config Debug --target biocore-local-server-bootstrap-tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run only local_server_bootstrap
        shell: pwsh
        run: |
          ctest --test-dir build/windows-probe -C Debug -R "^integration\.local_server_bootstrap$" --output-on-failure --timeout 120 -V
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload probe CTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-local-server-bootstrap-probe-log
          path: build/windows-probe/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
