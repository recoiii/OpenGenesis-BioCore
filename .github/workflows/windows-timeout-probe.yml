name: OpenGenesis-BioCore Windows timeout probe

on:
  push:
    branches:
      - iteration-054-timeout-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-path-semantics-probe:
    name: Windows filesystem path semantics probe
    runs-on: windows-latest
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and run isolated filesystem probe
        shell: pwsh
        run: |
          @'
          #include <cwchar>
          #include <filesystem>
          #include <iostream>
          #include <system_error>

          int wmain() {
              namespace fs = std::filesystem;
              std::error_code ec;

              const auto temp = fs::temp_directory_path();
              const auto base = temp / L"biocore-path-semantics-probe";
              fs::remove_all(base, ec);
              ec.clear();
              fs::create_directories(base, ec);
              if (ec) {
                  std::wcerr << L"create base failed: " << ec.value() << L'\n';
                  return 2;
              }

              const auto requested = base / L"project-a";
              const auto absolute = fs::absolute(requested, ec).lexically_normal();
              if (ec) {
                  std::wcerr << L"absolute failed: " << ec.value() << L'\n';
                  return 3;
              }

              fs::create_directory(absolute, ec);
              if (ec) {
                  std::wcerr << L"create project failed: " << ec.value() << L'\n';
                  return 4;
              }

              const auto canonical = fs::canonical(absolute, ec);
              if (ec) {
                  std::wcerr << L"canonical failed: " << ec.value() << L'\n';
                  return 5;
              }

              const auto& absolute_native = absolute.native();
              const auto& canonical_native = canonical.native();
              const int text_compare = _wcsicmp(canonical_native.c_str(), absolute_native.c_str());

              ec.clear();
              const bool equivalent = fs::equivalent(canonical, absolute, ec);

              std::wcout << L"temp=" << temp.native() << L'\n';
              std::wcout << L"absolute=" << absolute_native << L'\n';
              std::wcout << L"canonical=" << canonical_native << L'\n';
              std::wcout << L"absolute_length=" << absolute_native.size() << L'\n';
              std::wcout << L"canonical_length=" << canonical_native.size() << L'\n';
              std::wcout << L"wcsicmp=" << text_compare << L'\n';
              std::wcout << L"equivalent=" << (equivalent ? L"true" : L"false") << L'\n';
              std::wcout << L"equivalent_error=" << ec.value() << L'\n';

              std::error_code cleanup_ec;
              fs::remove_all(base, cleanup_ec);

              return equivalent && !ec ? 0 : 6;
          }
          '@ | Set-Content -Path windows-path-semantics-probe.cpp -Encoding utf8

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw "Visual Studio C++ toolchain not found" }
          $devCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"

          $command = '"' + $devCmd + '" -arch=x64 -host_arch=x64 && cl /nologo /std:c++20 /EHsc windows-path-semantics-probe.cpp /Fe:windows-path-semantics-probe.exe && windows-path-semantics-probe.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
