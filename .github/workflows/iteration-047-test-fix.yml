name: Iteration 047 CI fixture corrections

on:
  push:
    branches:
      - v0.2.0-dev

permissions:
  contents: write

jobs:
  apply-corrections:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: v0.2.0-dev

      - name: Correct Iteration 047 regression fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('tests/worker_event_ingestion_tests.cpp')
          text = worker.read_text(encoding='utf-8')
          old = '''           result.persisted_job->failure()->worker_timestamp_utc() ==\n               std::optional<std::string>{"worker-time"} &&'''
          new = '''           result.persisted_job->failure()->worker_timestamp_utc() ==\n               std::optional<std::string>{"2026-08-06T20:02:00Z"} &&'''
          if old not in text:
              raise SystemExit('worker timestamp expectation anchor not found')
          worker.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          project = Path('tests/project_database_tests.cpp')
          text = project.read_text(encoding='utf-8')
          old = '''        CREATE TABLE jobs (\n            id TEXT PRIMARY KEY NOT NULL,\n            progress REAL NOT NULL\n        );\n        INSERT INTO jobs(id, progress) VALUES ('job-1', 0.42);'''
          new = '''        CREATE TABLE jobs (\n            id TEXT PRIMARY KEY NOT NULL,\n            status TEXT NOT NULL,\n            priority TEXT NOT NULL DEFAULT 'normal',\n            progress REAL NOT NULL,\n            active_step_id TEXT,\n            created_at_utc TEXT NOT NULL,\n            updated_at_utc TEXT NOT NULL,\n            analysis_id TEXT,\n            pipeline_id TEXT,\n            pipeline_version TEXT,\n            started_at_utc TEXT,\n            finished_at_utc TEXT,\n            revision INTEGER NOT NULL DEFAULT 0\n        );\n        INSERT INTO jobs(\n            id, status, priority, progress, created_at_utc, updated_at_utc\n        ) VALUES ('job-1', 'running', 'normal', 0.42, 'created', 'updated');'''
          if old not in text:
              raise SystemExit('version-three job fixture anchor not found')
          project.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          rm .github/workflows/iteration-047-test-fix.yml

      - name: Commit corrected candidate
        shell: bash
        run: |
          git config user.name "OpenGenesis-BioCore Automation"
          git config user.email "noreply@github.com"
          git add tests/worker_event_ingestion_tests.cpp tests/project_database_tests.cpp .github/workflows/iteration-047-test-fix.yml
          git commit -m "Iteration 047: correct regression fixtures"
          git push origin HEAD:v0.2.0-dev
